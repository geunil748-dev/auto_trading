[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Phase 2 mock-trading core for a US small-cap momentum bot."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
integrations = [
    "apscheduler>=3.11,<4",
    "pyodbc>=5.0",
    "tzdata>=2025.2",
    "yfinance>=0.2",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
trading-bot = "trading_bot.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
